name: Go Build, SonarQube Analysis

on:
  push:
    branches:
      - main
      - ver2.0
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod tidy

      - name: Build Go apps
        run: |
          go build -trimpath -tags=golc -o golc ./golc.go
          go build -trimpath -tags=resultsall -o ResultsAll ./ResultsAll.go

      - name: Generate test coverage reports
        run: |
          cp config_sample.json config.json

          echo "Testing pkg/ directory..."
          go test -coverprofile=coverage-pkg.out ./pkg/...

          echo "Testing golc application..."
          go test -tags=golc -coverprofile=coverage-golc.out .

          echo "Testing resultsall application..."
          go test -tags=resultsall -coverprofile=coverage-resultsall.out .

          echo "Coverage summary:"
          echo "pkg/:"
          go tool cover -func=coverage-pkg.out | tail -1
          echo "golc:"
          go tool cover -func=coverage-golc.out | tail -1
          echo "resultsall:"
          go tool cover -func=coverage-resultsall.out | tail -1

      - name: Run SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarQube Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
