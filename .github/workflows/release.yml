name: Release

# Run by hand from the Actions tab (Run workflow) on main, once a version is ready.
# Commits the README version bump to main, builds the six platform zips, pushes the
# container image to ghcr.io, then tags that commit and publishes the GitHub release
# with the zips attached.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the V (e.g. 2.1.2)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  MODULE: github.com/SonarSource-Demos/sonar-golc
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Fail before building anything if the release can't be made as asked.
      - name: Check version
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$GITHUB_REF" = "refs/heads/main" ] || fail "Run this workflow from main, not $GITHUB_REF."
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || fail "Version must look like 2.1.2 (no V prefix), got '$VERSION'."
          ! git rev-parse -q --verify "refs/tags/V$VERSION" >/dev/null || fail "Tag V$VERSION already exists."

          # A build refuses any config.json whose major version differs from version1,
          # so a major bump must update both before it can ship.
          major="${VERSION%%.*}"
          code_version=$(sed -n 's/^var version1 = "\(.*\)"/\1/p' golc.go)
          config_version=$(jq -r '.Release.Version' config_sample.json)
          [ "${code_version%%.*}" = "$major" ] || fail "version1 in golc.go is $code_version; set it to $major.x before releasing $VERSION."
          [ "${config_version%%.*}" = "$major" ] || fail "Release.Version in config_sample.json is $config_version; set it to $major.x before releasing $VERSION."

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - name: Run tests
        run: |
          cp config_sample.json config.json
          go test ./pkg/...
          go test -tags=engine .
          go test -tags=resultsall .
          rm config.json

      # Commit the README's version references to main, so the zips, the tag and the
      # repo all show the version being released. The tag goes on this commit.
      # Re-running after a later step failed finds nothing to change and moves on.
      - name: Update version in README
        id: bump
        run: |
          set -euo pipefail
          sed -i -E \
            -e "s/^> Current version: \*\*v[0-9.]+\*\*/> Current version: **v$VERSION**/" \
            -e "s/(for example) \`V[0-9.]+\`/\1 \`V$VERSION\`/" \
            README.md
          grep -q "^> Current version: \*\*v$VERSION\*\*" README.md || { echo "::error::README.md has no '> Current version: **v...**' line to update."; exit 1; }

          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(release): V$VERSION" README.md
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Claude writes the notes from the commits and PRs since the previous tag, in the
      # style of earlier hand-written notes (.github/scripts/release_notes.py). If this
      # step fails for any reason, the release falls back to GitHub's generated notes.
      - name: Write release notes
        continue-on-error: true
        env:
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$PORTKEY_API_KEY" ]; then
            echo "::warning::The PORTKEY_API_KEY secret is not set, so the release uses GitHub's generated notes."
            exit 1
          fi
          python3 -m venv "$RUNNER_TEMP/notes-venv"
          "$RUNNER_TEMP/notes-venv/bin/pip" install --quiet anthropic==1.11.0
          "$RUNNER_TEMP/notes-venv/bin/python" .github/scripts/release_notes.py "$RUNNER_TEMP/release-notes.md"

      - name: Build platform zips
        run: |
          set -euo pipefail
          ldflags="-X $MODULE/assets.Version=ver$VERSION"
          mkdir -p dist-release

          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            [ "$goos" = "windows" ] && ext=".exe"
            name="golc_ver${VERSION}_${goos}_${goarch}"
            out="build/$name"
            mkdir -p "$out"

            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -tags=launcher -ldflags "$ldflags" -o "$out/golc-launcher$ext" golc-launcher.go golc.go
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -tags=resultsall -ldflags "$ldflags" -o "$out/ResultsAll$ext" ResultsAll.go

            cp README.md LICENSE "$out/"
            cp -r imgs "$out/"
            cp config_sample.json "$out/config.json"

            (cd build && zip -qr "../dist-release/$name.zip" "$name")
          done
          ls -l dist-release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=V${{ inputs.version }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=ver${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [ -s "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
            notes_source="written by Claude"
          else
            echo "::warning::Release notes were not written by Claude; using GitHub's generated notes."
            notes=(--generate-notes)
            notes_source="generated by GitHub (fallback)"
          fi
          gh release create "V$VERSION" dist-release/*.zip \
            --target "${{ steps.bump.outputs.sha }}" \
            --title "V$VERSION" \
            "${notes[@]}" \
            --latest
          echo "### Released V$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Notes: $notes_source" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/V$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`docker pull $IMAGE:V$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
